<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.5; }
      100% { transform: translateY(400px); opacity: 0.2; }
    }
    .node-pulse { animation: pulse 4s infinite ease-in-out; }
    .float-node1 { animation: float1 6s infinite ease-in-out; }
    .float-node2 { animation: float2 7s infinite ease-in-out; }
    .flow-line { stroke-dasharray: 8 8; animation: dash 3s linear infinite; }
    .scan-line { animation: scan 8s linear infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.02em; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />

  <!-- Grid Pattern Background -->
  <g opacity="0.12">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" stroke="#94a3b8" stroke-width="1" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Dynamic Scanning Line -->
  <line class="scan-line" x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="2" opacity="0.4" filter="url(#glow)" />

  <!-- Background Animated Network / Dynamic Graph Elements (positioned safely in background) -->
  <g opacity="0.35">
    <!-- Connecting Flow Lines -->
    <path class="flow-line" d="M 150 80 Q 300 40 450 100 T 750 60 T 1050 90" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="flow-line" d="M 100 320 Q 350 360 600 310 T 1100 330" fill="none" stroke="#38bdf8" stroke-width="2" />

    <!-- Pulsing Nodes -->
    <circle class="node-pulse float-node1" cx="150" cy="80" r="14" fill="#38bdf8" filter="url(#glow)" />
    <circle class="node-pulse float-node2" cx="450" cy="100" r="10" fill="#c084fc" filter="url(#glow)" />
    <circle class="node-pulse float-node1" cx="750" cy="60" r="16" fill="#818cf8" filter="url(#glow)" />
    <circle class="node-pulse float-node2" cx="1050" cy="90" r="12" fill="#34d399" filter="url(#glow)" />

    <circle class="node-pulse float-node2" cx="100" cy="320" r="12" fill="#818cf8" filter="url(#glow)" />
    <circle class="node-pulse float-node1" cx="600" cy="310" r="15" fill="#38bdf8" filter="url(#glow)" />
    <circle class="node-pulse float-node2" cx="1100" cy="330" r="10" fill="#f43f5e" filter="url(#glow)" />
  </g>

  <!-- Foreground Backdrop Panel (Ensures text/title readability) -->
  <rect x="100" y="60" width="1000" height="280" rx="20" fill="#0b0f19" fill-opacity="0.65" stroke="#334155" stroke-width="1.5" style="backdrop-filter: blur(10px);" />

  <!-- Foreground Content -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text class="title-text" x="600" y="145" font-size="42" fill="url(#titleGradient)">
      AWESOME ENGINEERING INTELLIGENCE PLATFORM
    </text>

    <!-- Subtitle -->
    <text class="subtitle-text" x="600" y="195" font-size="20" fill="#94a3b8">
      Curated Ecosystem of Engineering Management, DORA Metrics &amp; Dev Analytics
    </text>

    <!-- Sub-subtitle / Feature Bar -->
    <text class="subtitle-text" x="600" y="228" font-size="14" fill="#cbd5e1" opacity="0.9">
      SaaS Analytics Platforms • Open-Source Dev Data Lakes • Self-Hosted Engineering Frameworks
    </text>
  </g>

  <!-- Interactive / Modern Pill Badges at Foreground Bottom -->
  <g transform="translate(160, 260)">
    <!-- Pill 1: DORA Metrics -->
    <g transform="translate(0, 0)">
      <rect width="150" height="36" rx="18" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" />
      <text class="badge-text" x="75" y="23" text-anchor="middle">📊 DORA Metrics</text>
    </g>

    <!-- Pill 2: DevEx -->
    <g transform="translate(170, 0)">
      <rect width="170" height="36" rx="18" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1" />
      <text class="badge-text" x="85" y="23" text-anchor="middle">🚀 Developer Experience</text>
    </g>

    <!-- Pill 3: Cycle Time -->
    <g transform="translate(360, 0)">
      <rect width="160" height="36" rx="18" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1" />
      <text class="badge-text" x="80" y="23" text-anchor="middle">⚡ Cycle Time &amp; WIP</text>
    </g>

    <!-- Pill 4: Open Source Data Lakes -->
    <g transform="translate(540, 0)">
      <rect width="180" height="36" rx="18" fill="url(#pillGrad)" stroke="#34d399" stroke-width="1" />
      <text class="badge-text" x="90" y="23" text-anchor="middle">🧠 Dev Data Platforms</text>
    </g>

    <!-- Pill 5: Self-Hosted -->
    <g transform="translate(740, 0)">
      <rect width="140" height="36" rx="18" fill="url(#pillGrad)" stroke="#f43f5e" stroke-width="1" />
      <text class="badge-text" x="70" y="23" text-anchor="middle">🔒 Self-Hosted</text>
    </g>
  </g>
</svg>
