<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="titleGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="pillGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#334155" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}@keyframes float1{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes float2{0%{transform:translateY(0)}50%{transform:translateY(12px)}}@keyframes scan{0%{transform:translateY(0);opacity:.2}50%{opacity:.5}}.node-pulse{animation:pulse 4s infinite ease-in-out}.float-node1{animation:float1 6s infinite ease-in-out}.float-node2{animation:float2 7s infinite ease-in-out}.flow-line{stroke-dasharray:8 8;animation:dash 3s linear infinite}.scan-line{animation:scan 8s linear infinite}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.02em}.subtitle-text{font-weight:500}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}</style><rect width="1200" height="400" fill="url(#bgGradient)" rx="16"/><g opacity=".12"><path stroke="#94a3b8" stroke-width="1" d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350"/><path stroke="#94a3b8" stroke-width="1" d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400"/></g><line x1="0" x2="1200" y1="0" y2="0" stroke="#38bdf8" stroke-width="2" class="scan-line" filter="url(#glow)" opacity=".4"/><g opacity=".35"><path fill="none" stroke="#818cf8" stroke-width="2" d="M 150 80 Q 300 40 450 100 T 750 60 T 1050 90" class="flow-line"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 100 320 Q 350 360 600 310 T 1100 330" class="flow-line"/><circle cx="150" cy="80" r="14" fill="#38bdf8" class="node-pulse float-node1" filter="url(#glow)"/><circle cx="450" cy="100" r="10" fill="#c084fc" class="node-pulse float-node2" filter="url(#glow)"/><circle cx="750" cy="60" r="16" fill="#818cf8" class="node-pulse float-node1" filter="url(#glow)"/><circle cx="1050" cy="90" r="12" fill="#34d399" class="node-pulse float-node2" filter="url(#glow)"/><circle cx="100" cy="320" r="12" fill="#818cf8" class="node-pulse float-node2" filter="url(#glow)"/><circle cx="600" cy="310" r="15" fill="#38bdf8" class="node-pulse float-node1" filter="url(#glow)"/><circle cx="1100" cy="330" r="10" fill="#f43f5e" class="node-pulse float-node2" filter="url(#glow)"/></g><rect width="1000" height="280" x="100" y="60" fill="#0b0f19" fill-opacity=".65" stroke="#334155" stroke-width="1.5" rx="20" style="backdrop-filter:blur(10px)"/><g text-anchor="middle"><text x="600" y="145" fill="url(#titleGradient)" class="title-text" font-size="42">AWESOME ENGINEERING INTELLIGENCE PLATFORM</text><text x="600" y="195" fill="#94a3b8" class="subtitle-text" font-size="20">Curated Ecosystem of Engineering Management, DORA Metrics &amp; Dev Analytics</text><text x="600" y="228" fill="#cbd5e1" class="subtitle-text" font-size="14" opacity=".9">SaaS Analytics Platforms • Open-Source Dev Data Lakes • Self-Hosted Engineering Frameworks</text></g><g><g transform="translate(160, 260) translate(0, 0)"><rect width="150" height="36" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" rx="18"/><text x="75" y="23" class="badge-text" text-anchor="middle">📊 DORA Metrics</text></g><g transform="translate(160, 260) translate(170, 0)"><rect width="170" height="36" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1" rx="18"/><text x="85" y="23" class="badge-text" text-anchor="middle">🚀 Developer Experience</text></g><g transform="translate(160, 260) translate(360, 0)"><rect width="160" height="36" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1" rx="18"/><text x="80" y="23" class="badge-text" text-anchor="middle">⚡ Cycle Time &amp; WIP</text></g><g transform="translate(160, 260) translate(540, 0)"><rect width="180" height="36" fill="url(#pillGrad)" stroke="#34d399" stroke-width="1" rx="18"/><text x="90" y="23" class="badge-text" text-anchor="middle">🧠 Dev Data Platforms</text></g><g transform="translate(160, 260) translate(740, 0)"><rect width="140" height="36" fill="url(#pillGrad)" stroke="#f43f5e" stroke-width="1" rx="18"/><text x="70" y="23" class="badge-text" text-anchor="middle">🔒 Self-Hosted</text></g></g></svg>